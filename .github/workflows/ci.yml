name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Aynı dal için eski koşuları iptal et
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v7.0.1

      - name: Node kurulumu (.nvmrc sürümü + npm önbelleği)
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Bağımlılıklar (kilit dosyasıyla temiz kurulum)
        run: npm ci

      - name: Bağımlılık güvenlik denetimi
        run: npm audit --audit-level=moderate

      - name: Lint (ESLint CLI)
        run: npm run lint

      - name: Tip denetimi (tsc --noEmit)
        run: npm run typecheck

      # Hızlı DOM entegrasyon katmanı: birim testleri node, tests/e2e jsdom ortamında koşar.
      - name: Testler (birim + jsdom akış regresyonları)
        run: npm run test

      # Q18 doğrulayıcısı: bulmaca şeması, kimlikler, Türkçe tekrarlar ve kör tahtalar.
      - name: İçerik doğrulaması (bulmaca şeması)
        run: npm run validate:content

      - name: Üretim derlemesi (next build)
        run: npm run build

      # npm 10'un Arborist'i bu yükseltilmiş dependency graph üzerinde no-save Playwright
      # eklerken edgesOut hatasına düşüyor. Uygulamanın lockfile sözleşmesi npm 10'da kalır;
      # yalnız geçici CI aracı kurulumu için npm 11 kullanılır.
      - name: Playwright kurulumu için npm 11
        run: npm install --global npm@11.19.1

      # Playwright proje bağımlılığına eklenmiyor; CI aracı sabit sürümle no-save kurulur.
      - name: Playwright aracı (sabit sürüm)
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.63.0

      - name: Playwright test tip denetimi
        run: npm run typecheck:browser

      - name: Chromium ve sistem bağımlılıkları
        run: npx playwright install --with-deps chromium

      - name: Gerçek tarayıcı regresyonu (Chromium)
        env:
          QUADRO_BASE_URL: http://127.0.0.1:3000
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/quadro-next.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl -fsS "$QUADRO_BASE_URL" >/dev/null; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/quadro-next.log
              exit 1
            fi
            sleep 1
          done

          if ! curl -fsS "$QUADRO_BASE_URL" >/dev/null; then
            cat /tmp/quadro-next.log
            exit 1
          fi

          npm run test:browser

      - name: Playwright raporu ve izleri
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-raporu
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
