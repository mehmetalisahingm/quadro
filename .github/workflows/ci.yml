name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Aynı dal için eski koşuları iptal et
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: Node kurulumu (.nvmrc sürümü + npm önbelleği)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Bağımlılıklar (kilit dosyasıyla temiz kurulum)
        run: npm ci

      - name: Lint (ESLint CLI)
        run: npm run lint

      - name: Tip denetimi (tsc --noEmit)
        run: npm run typecheck

      - name: Testler (Vitest)
        run: npm run test

      - name: Üretim derlemesi (next build)
        run: npm run build
