name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Aynı dal için eski koşuları iptal et
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (temiz kurulum)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Birim testleri (node) ve ilk akışın tarayıcı regresyonları (tests/e2e, jsdom) birlikte koşar.
      # jsdom npm paketidir; ayrı tarayıcı kurulumu gerekmez.
      - name: Test (birim + akış regresyonları)
        run: npm run test

      - name: Build (üretim derlemesi)
        run: npm run build
