name: Resolve dependency advisories (temporary)
on:
  push:
    branches: [feat/quadro-ultra-hard-balanced-12-puzzles]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Use supported npm 11 to avoid npm 10 Arborist lockfile failure
        run: npm install --global npm@11.19.1
      - name: Refresh all fixable audit advisories in lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Save generated lockfile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes available"
          else
            git commit -m "fix(security): refresh vulnerable transitive packages"
            git push origin HEAD:refs/heads/feat/quadro-ultra-hard-balanced-12-puzzles
          fi
