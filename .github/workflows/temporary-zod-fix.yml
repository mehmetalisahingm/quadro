name: Refresh Zod security fix (temporary)
on:
  push:
    branches: [feat/quadro-ultra-hard-balanced-12-puzzles]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Use npm 11 to resolve lockfile
        run: npm install --global npm@11.19.1
      - name: Rebuild lockfile from security-patched overrides
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 1 || true
          git commit -m "fix(security): use patched Zod 4.6.7"
          git push origin HEAD:refs/heads/feat/quadro-ultra-hard-balanced-12-puzzles
