name: Security Audit Diagnostic

on:
  push:
    branches:
      - codex/security-audit-cleanup

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Candidate package metadata
        run: |
          echo 'NEXT PEERS'
          npm view next@16.3.5 peerDependencies engines
          echo 'ESLINT CONFIG NEXT PEERS'
          npm view eslint-config-next@16.3.5 peerDependencies
          echo 'VITEST 4.1.11'
          npm view vitest@4.1.11 peerDependencies engines
          echo 'CURRENT LATEST REACT'
          npm view react version
          npm view react-dom version
          echo 'CURRENT LATEST ESLINT'
          npm view eslint version
