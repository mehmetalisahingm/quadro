name: Lockfile security upgrade (temporary)
on:
  push:
    branches: [feat/quadro-ultra-hard-balanced-12-puzzles]
permissions:
  contents: write
jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Resolve patched Next.js dependencies with npm
        run: npm install --package-lock-only --ignore-scripts --save-exact next@16.4.3 eslint-config-next@16.4.3
      - name: Commit generated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix(security): upgrade Next.js to patched 16.4.3"
          git push origin HEAD:refs/heads/feat/quadro-ultra-hard-balanced-12-puzzles
